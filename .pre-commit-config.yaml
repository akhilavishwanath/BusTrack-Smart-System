repos:
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks:
      - id: eslint

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: typecheck
        name: Type Check
        entry: npx tsc --version
        language: system

      - id: security
        name: Security Scan
        entry: echo "gitleaks enabled"
        language: system
