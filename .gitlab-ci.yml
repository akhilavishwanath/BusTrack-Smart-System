stages:
  - lint
  - format
  - type_check
  - test
  - coverage

lint-job:
  stage: lint
  image: node:20
  script:
    - npm install
    - npx eslint .

format-job:
  stage: format
  image: node:20
  script:
    - npm install
    - npx prettier --check .

typecheck-job:
  stage: type_check
  image: node:20
  script:
    - npm install
    - npx tsc --version
    - npx knip || true

test-job:
  stage: test
  image: node:20
  script:
    - npm install
    - npm test || true

coverage-job:
  stage: coverage
  image: node:20
  script:
    - npm install
    - npm run coverage || true

audit-job:
  stage: test
  image: node:20
  script:
    - npm audit --audit-level=high || true

secret-scan:
  stage: test
  image: node:20
  script:
    - echo "Running gitleaks secret scan"
